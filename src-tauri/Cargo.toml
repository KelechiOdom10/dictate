[package]
name = "dictate"
version = "0.1.0"
description = "Local dictation: hold a key, speak, and the transcript lands in the app that already had focus."
authors = ["Kelechi Odom"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dictate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
log = "0.4"

# Added by you during the spike, not before:
cpal = "0.16"
rubato = "0.16"
hound = "3.5"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "11"
rusqlite = { version = "0.42.0", features = ["bundled"] }
ureq = "3"
sha2 = "0.10"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
tauri-plugin-notification = "2"
# Parakeet runs in process on ggml with Metal. Building it needs CMake.
transcribe-cpp = { version = "=0.4.2", default-features = false, features = ["metal"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# The frames stage encodes PNGs and scales images. Optimised in debug builds
# too, so the stop-to-package time the frames test logs reflects real code.
[profile.dev.package]
tiny-skia = { opt-level = 3 }
tiny-skia-path = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
flate2 = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
crc32fast = { opt-level = 3 }
adler2 = { opt-level = 3 }
# ggml is C++ built by CMake, which follows this opt-level. At 0 it builds a
# Debug ggml and every dev-build dictation pays for it.
transcribe-cpp-sys = { opt-level = 3 }

[profile.dev.package.dictate]
opt-level = 2

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSAlert", "NSApplication", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSWindow", "NSWorkspace", "NSAppearance", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSError", "NSGeometry", "NSString", "NSURL"] }
screencapturekit = { version = "11", features = ["macos_15_0"] }
block2 = "0.6"
# Annotate's ink panel and floating bar: non-activating panels (spike #13).
tauri-nspanel = "2.1.1"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-graphics", "objc2-core-media", "AVAsset", "AVAssetImageGenerator"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSColor", "NSGraphics", "NSResponder", "NSRunningApplication", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSDate", "NSDictionary", "NSGeometry", "NSRunLoop", "NSValue"] }
# Writes the test MP4 in tests/annotate_frames.rs.
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-media", "objc2-core-video", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
